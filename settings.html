<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>便签设置</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      /* 同步铺底：透明窗体下必须透明，否则 WebView 自铺实色会盖住 DWM 原生 Acrylic 磨砂。
         非透明主题由 .settings-standalone .settings-modal 实色垫底，透明主题由半透面板
         叠在 Acrylic 上 —— 二者都不依赖 body 实色。脚本出错时由 #settings-fatal 实色兜底，不会白板。 */
      html, body { margin: 0; height: 100%; background: transparent; }
    </style>
  </head>
  <body>
    <script type="module" src="/src/settings-window.ts"></script>
  </body>
</html>
